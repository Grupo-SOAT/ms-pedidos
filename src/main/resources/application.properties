server.port=8082
spring.application.name=ms-pedidos

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/oficina_ms_pedidos}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ms_pedidos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ms_pedidos}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:ms-pedidos-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.events.topic.service-order=${APP_EVENTS_TOPIC_SERVICE_ORDER:service-order-events}
app.events.topic.budget=${APP_EVENTS_TOPIC_BUDGET:budget-events}
app.events.topic.payment=${APP_EVENTS_TOPIC_PAYMENT:payment-events}
app.events.topic.execution=${APP_EVENTS_TOPIC_EXECUTION:execution-events}
app.mnl.base-url=${APP_MNL_BASE_URL:http://localhost:8080}
